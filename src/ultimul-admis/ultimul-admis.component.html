<div
  class=" relative w-[98%] max-w-6xl mx-auto mt-6 bg-white/90 backdrop-blur rounded-2xl p-10 pb-0 shadow-lg transition-all duration-500"
>

<button
  type="button"
  (click)="goBack()"
  class="absolute top-5 left-5 flex items-center gap-2 text-purple-700 hover:text-purple-800 font-medium bg-white/70 hover:bg-white rounded-full px-3 py-1 shadow transition"
>
  <i class="pi pi-arrow-left"></i>
  Înapoi
</button>

  <h2 class="text-center text-2xl font-semibold text-purple-700 mb-6">
    Poziția ultimului admis pe ani - liceu și specializare
  </h2>

  <div class="flex flex-col md:flex-row gap-4 mb-4">
    <p-dropdown
      [options]="judete"
      [(ngModel)]="selectedJudet"
      (ngModelChange)="onJudetChange($event)"
      placeholder="Selectează județul"
      optionLabel="label"
      [showClear]="true"
      [styleClass]="'w-full p-inputtext-sm text-base'"
      class="w-full md:w-1/3 mb-4"
    />

    <p-dropdown
      [options]="licee"
      [(ngModel)]="selectedLiceu"
      (ngModelChange)="onLiceuChange($event)"
      [disabled]="!selectedJudet"
      placeholder="Selectează liceul"
      optionLabel="label"
      [filter]="true"
      [showClear]="true"
      [styleClass]="'w-full p-inputtext-sm text-base'"
      class="w-full md:w-1/2"
    />

    <p-dropdown
      [options]="specializari"
      [(ngModel)]="selectedSpec"
      [disabled]="!selectedLiceu"
      placeholder="Selectează specializarea"
      optionLabel="label"
      [showClear]="true"
      [styleClass]="'w-full p-inputtext-sm text-base'"
      class="w-full md:w-1/2"
    />
  </div>

  <div class="flex flex-col gap-2 mb-3">
    <div class="flex gap-4">
      <button
        pButton
        type="button"
        icon="pi pi-plus"
        label="Adaugă filtru"
        (click)="adaugaFiltru()"
        [disabled]="!selectedJudet || !selectedLiceu || !selectedSpec"
        class="bg-purple-700 hover:bg-purple-800 text-white p-button font-semibold rounded-lg shadow-md transform transition duration-200 ease-in-out hover:scale-105 px-4 py-2"
      ></button>

      <button
        pButton
        type="button"
        icon="pi pi-trash"
        label="Curăță filtre"
        (click)="curataFiltre()"
        [disabled]="filtreActive.length === 0"
        class="bg-gray-300 hover:bg-gray-400 text-gray-800 p-button font-semibold rounded-lg shadow-md transform transition duration-200 ease-in-out hover:scale-105 px-4 py-2"
      ></button>
    </div>

    <div>
      <canvas
        baseChart
        [datasets]="chartData"
        [labels]="chartLabels"
        [options]="chartOptions"
        [type]="chartType"
        style="min-height: 400px; height: auto; max-height: 1000px; width: 100%"
      ></canvas>

      <p
        *ngIf="chartData && chartData.length > 0"
        class="text-center text-sm text-purple-700 mt-4 mb-6 flex items-center justify-center gap-2"
      >
        <i class="pi pi-info-circle text-purple-600 text-base"></i>
        Poți face click pe o culoare din legendă pentru a elimina specializarea
        din grafic.
      </p>
    </div>
  </div>
</div>
