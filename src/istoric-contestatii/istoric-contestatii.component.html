<div
  class="relative w-[90%] max-w-5xl mx-auto mt-16 bg-white/90 backdrop-blur rounded-2xl p-10 shadow-lg"
>
  <button
    type="button"
    (click)="goBack()"
    class="absolute top-5 left-5 flex items-center gap-2 text-purple-700 hover:text-purple-800 font-medium bg-white/70 hover:bg-white rounded-full px-3 py-1 shadow transition"
  >
    <i class="pi pi-arrow-left"></i>
    Înapoi
  </button>
  <h2 class="text-center text-2xl font-semibold text-purple-700 mb-6">
    Istoric contestații pe ani, județ și materie
  </h2>

  <form class="flex flex-wrap justify-between items-end gap-4 mb-6">
    <div class="flex-1 min-w-[180px]">
      <label class="block mb-1 font-medium text-gray-700">An:</label>
      <p-dropdown
        [options]="years"
        [(ngModel)]="selectedYear"
        (ngModelChange)="onYearChange($event)"
        optionLabel="label"
        placeholder="Selectează anul"
        [showClear]="true"
        class="dropdown-larg"
        name="year"
      ></p-dropdown>
    </div>

    <div class="flex-1 min-w-[180px]">
      <label class="block mb-1 font-medium text-gray-700">Județ:</label>
      <p-dropdown
        [options]="judete"
        [(ngModel)]="selectedJudet"
        (ngModelChange)="onJudetChange($event)"
        optionLabel="label"
        placeholder="Selectează județul"
        [showClear]="true"
        class="dropdown-larg"
        name="judet"
      ></p-dropdown>
    </div>

    <div class="flex-1 min-w-[180px]">
      <label class="block mb-1 font-medium text-gray-700">Materie:</label>
      <p-dropdown
        [options]="subjects"
        [(ngModel)]="selectedSubject"
        (ngModelChange)="onSubjectChange($event)"
        optionLabel="label"
        placeholder="Selectează materia"
        [showClear]="true"
        class="dropdown-larg"
        name="subject"
      ></p-dropdown>
    </div>
  </form>

  <ng-container *ngIf="selectedYear && selectedJudet && selectedSubject">
    <div
      *ngIf="afiseazaStatistici"
      class="mb-6 bg-purple-50 rounded-xl p-6 shadow-md text-gray-800"
    >
      <h3 class="text-xl font-semibold mb-4 text-purple-700">
        Statistici contestații:
      </h3>
      <ul class="space-y-1">
        <li>
          Total contestații: <strong>{{ total }}</strong>
        </li>
        <li>
          Note crescute: <strong>{{ noteCrescute }}</strong>
        </li>
        <li>
          Note scăzute: <strong>{{ noteScazute }}</strong>
        </li>
        <li>
          Fără modificare: <strong>{{ noteNeschimbate }}</strong>
        </li>
        <li>
          Diferență medie:
          <strong>{{ diferentaMedie | number : "1.2-2" }}</strong>
        </li>
      </ul>
    </div>

    <p-tabView
      [(activeIndex)]="activeTabIndex"
      [styleClass]="'custom-tabview text-purple-700 mt-8'"
    >
      <p-tabPanel header="Evoluția notelor">
        <ng-template pTemplate="content">
          <canvas
            baseChart
            [datasets]="chartData"
            [labels]="chartLabels"
            [options]="chartOptions"
            [type]="chartType"
            style="min-height: 500px; width: 100%"
          ></canvas>
        </ng-template>
      </p-tabPanel>

      <p-tabPanel header="Deviația față de nota inițială">
        <ng-template pTemplate="content">
          <canvas
            baseChart
            [datasets]="deviationChartData"
            [labels]="deviationChartLabels"
            [options]="deviationChartOptions"
            [type]="deviationChartType"
            style="min-height: 300px; width: 100%"
          ></canvas>
        </ng-template>
      </p-tabPanel>
    </p-tabView>
  </ng-container>
</div>
